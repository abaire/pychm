name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/**'
  pull_request:
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/**'
      - 'AUTHORS'
      - 'COPYING'
      - 'HACKING'
      - 'INSTALL'
      - 'LICENSE'
      - 'NEWS'
      - 'README.md'
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  select-python-version-for-publishing:
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.select-version.outputs.version }}
    steps:
      - id: select-version
        run: echo "version=3.9" >> $GITHUB_OUTPUT


