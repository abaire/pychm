  build-macos:
    needs: [ select-python-version-for-publishing ]
    name: Build Python sdist and wheel for ${{ matrix.python-version }} on MacOS
    runs-on: macos-latest

    strategy:
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install \
            chmlib
          
          python3 -m venv venv
          source venv/bin/activate
          pip install \
            setuptools

      - name: Build sdist and wheel
        run: |
          source venv/bin/activate
          export CPPFLAGS="-I$(brew --prefix chmlib)/include"
          export LDFLAGS="-L$(brew --prefix chmlib)/lib"
          
          python3 setup.py sdist
          python3 setup.py bdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        if: ${{ matrix.python-version }} == ${{ needs.select-python-version-for-publishing.outputs.python-version }}
        with:
          name: source-macos-${{ matrix.python-version }}
          path: dist/*.tar.gz

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        if: ${{ matrix.python-version }} == ${{ needs.select-python-version-for-publishing.outputs.python-version }}
        with:
          name: wheel-macos-${{ matrix.python-version }}
          path: dist/*.whl


